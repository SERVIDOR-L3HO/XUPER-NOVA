<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Deportes</title>
<style>
:root{--bg:#080910;--panel:#151722;--panel2:#1d1b30;--muted:#aaa8bb;--accent:#a44cff;--cyan:#5be7ff;--pink:#ff4fd8;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 90% 0,#29144b 0,transparent 34%),var(--bg);color:#fff;font-family:Arial,sans-serif}
body{padding-bottom:30px}.top{position:sticky;top:0;z-index:3;background:rgba(8,9,16,.93);backdrop-filter:blur(18px);padding:15px 16px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.brand-mark{width:34px;height:34px;border-radius:11px;object-fit:cover;box-shadow:0 0 22px rgba(164,76,255,.6)}.brand-name{font-size:12px;letter-spacing:2.5px;font-weight:800;background:linear-gradient(90deg,#fff,var(--cyan),var(--pink));-webkit-background-clip:text;color:transparent}.brand-live{margin-left:auto;display:flex;align-items:center;gap:6px;color:#ff7895;font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase}.dot{width:7px;height:7px;background:#ff587f;border-radius:50%;box-shadow:0 0 10px #ff587f}
h1{font-size:25px;margin:0 0 5px;letter-spacing:.2px}.sub{font-size:12px;color:var(--muted)}
#status{padding:24px 16px;color:var(--muted);text-align:center}
.filters{display:flex;gap:8px;overflow:auto;padding:14px 14px 4px}.filter{border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.05);color:#d8d4e4;padding:9px 14px;white-space:nowrap}.filter.active{border-color:var(--accent);background:linear-gradient(100deg,#7d35d8,#bd57e8);color:#fff;box-shadow:0 5px 22px rgba(164,76,255,.25)}
.event{position:relative;margin:13px 14px;background:linear-gradient(135deg,rgba(39,30,63,.95),rgba(17,19,29,.98));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.2)}.event:before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--accent),var(--cyan),var(--pink))}
.event-head{padding:16px 16px 10px}.event-kicker{display:flex;align-items:center;gap:7px;color:#d5a8ff;font-size:10px;font-weight:bold;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:8px}.title{font-weight:bold;font-size:17px;line-height:1.3}.meta{color:var(--muted);font-size:12px;margin-top:7px}.live{color:#ff668b;font-weight:bold}
.channels{display:flex;gap:8px;flex-wrap:wrap;padding:2px 16px 16px}.channel{background:linear-gradient(100deg,#27203e,#392052);border:1px solid rgba(185,113,255,.3);border-radius:11px;color:#fff;padding:11px 13px;font-size:12px;font-weight:bold}.channel:active{background:linear-gradient(100deg,var(--accent),#e35bdc)}
#player{display:none;position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#241039 0,transparent 38%),#07080e;z-index:10;padding-top:24px;overflow:auto}.player-top{display:flex;align-items:center;justify-content:space-between;padding:7px 17px 15px}.player-brand{display:flex;align-items:center;gap:9px}.player-brand img{width:29px;height:29px;border-radius:9px;object-fit:cover}.player-brand span{font-size:11px;letter-spacing:2px;font-weight:800}.close-player{border:1px solid var(--line);border-radius:50%;width:33px;height:33px;background:rgba(255,255,255,.07);color:#fff;font-size:19px;line-height:28px}.stage{position:relative;padding:0 10px}.stage:before{content:"";position:absolute;inset:-1px 10px;background:linear-gradient(90deg,var(--accent),transparent 25%,transparent 75%,var(--cyan));opacity:.55;filter:blur(12px);z-index:-1}#clappr{width:100%;height:50vh;min-height:230px;background:#000;border-radius:16px;border:1px solid rgba(255,255,255,.16);overflow:hidden}#video{border-radius:16px!important}.player-info{margin:14px 16px 0;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,rgba(164,76,255,.16),rgba(255,255,255,.04))}.live-pill{display:inline-flex;align-items:center;gap:6px;color:#ff7895;font-size:10px;font-weight:bold;letter-spacing:1.2px;text-transform:uppercase}.playerbar{display:flex;align-items:center;gap:12px;padding:14px 0 4px}.back{border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.1);color:#fff;padding:10px 15px;font-weight:bold}.now{font-size:14px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{padding:7px 0 0;color:var(--muted);font-size:12px}.empty{padding:35px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<section class="top"><div class="brand"><img class="brand-mark" src="file:///android_asset/xuper_nova_mark.png"><span class="brand-name">XUPER NOVA</span><span class="brand-live"><i class="dot"></i> En vivo</span></div><h1>Deportes</h1><div class="sub">Eventos en vivo y próximos</div></section>
<div id="filters"></div><main id="events"><div id="status">Cargando transmisiones…</div></main>
<section id="player"><div class="player-top"><div class="player-brand"><img src="file:///android_asset/xuper_nova_mark.png"><span>XUPER NOVA SPORTS</span></div><button class="close-player" onclick="closePlayer()" aria-label="Cerrar">×</button></div><div class="stage"><div id="clappr"></div><video id="video" controls playsinline style="display:none;width:100%;height:50vh;background:#000"></video></div><div class="player-info"><div class="live-pill"><i class="dot"></i> Transmisión en vivo</div><div class="playerbar"><button class="back" onclick="closePlayer()">← Volver</button><div class="now" id="now"></div></div><div class="hint" id="playerHint"></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@clappr/player@0.8/dist/clappr.min.js"></script>
<script>
const API="https://ultrago-xi.vercel.app/gol-3";
let all=[], selected="Todas";
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function timeLabel(e){return [e.fecha,e.hora].filter(Boolean).join(" · ")}
function renderFilters(){let names=[...new Set(all.map(e=>e.liga).filter(Boolean))].slice(0,12);$("filters").innerHTML='<div class="filters"><button class="filter active" onclick="chooseFilter(this,\'Todas\')">Todas</button>'+names.map(n=>'<button class="filter" onclick="chooseFilter(this,\''+esc(n).replace(/'/g,"&#39;")+'\')">'+esc(n)+'</button>').join("")+'</div>'}
function chooseFilter(btn,name){selected=name;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()}
function render(){let list=selected==="Todas"?all:all.filter(e=>e.liga===selected);if(!list.length){$("events").innerHTML='<div class="empty">No hay eventos disponibles.</div>';return}
  $("events").innerHTML=list.map((e,i)=>{let channels=Array.isArray(e.canales)?e.canales:[];let key=all.indexOf(e);return '<article class="event"><div class="event-head"><div class="event-kicker"><i class="dot"></i>'+(e.estado==="EN VIVO"?"Al aire ahora":"Próximo evento")+'</div><div class="title">'+esc(e.titulo||[e.equipo1,e.equipo2].filter(Boolean).join(" vs "))+'</div><div class="meta">'+esc(e.liga||"Deportes")+' · '+esc(timeLabel(e))+' · <span class="'+(e.estado==="EN VIVO"?"live":"")+'">'+esc(e.estado||"")+'</span></div></div><div class="channels">'+(channels.length?channels.map((c,j)=>'<button class="channel" onclick="openChannel('+key+','+j+')">▶ '+esc(c.nombre||("Transmisión "+(j+1)))+'</button>').join(""):'<span class="meta">Sin enlaces disponibles</span>')+'</div></article>'}).join("")}
async function load(){try{let r=await fetch(API,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let data=await r.json();all=Array.isArray(data.transmisiones)?data.transmisiones:[];if(!all.length)throw Error("La API no devolvió transmisiones");renderFilters();render()}catch(e){$("status").innerHTML='<div class="empty">No se pudieron cargar los deportes.<br><small>'+esc(e.message)+'</small><br><button class="channel" onclick="load()">Reintentar</button></div>'}}
async function resolveM3u8(url,depth){if(depth>4)throw Error("Demasiadas redirecciones");let r=await fetch(url,{redirect:"follow",cache:"no-store"});let finalUrl=r.url||url;let text=await r.text();let normalized=text.replace(/\\\//g,"/").replace(/\\u002f/gi,"/");if(/\.m3u8([?#]|$)/i.test(finalUrl))return finalUrl;let m=normalized.match(/https?:[^"'<>\s]+\.m3u8(?:[?#][^"'<>\s]*)?/i);if(m)return m[0];if(/#EXTM3U/i.test(normalized))return finalUrl;let frame=normalized.match(/<iframe[^>]+src\s*=\s*["']([^"']+)/i);if(frame)return resolveM3u8(new URL(frame[1],finalUrl).href,depth+1);let source=normalized.match(/(?:source|playbackURL|file)\s*[:=]\s*["']([^"']+)/i);if(source&&/\.m3u8/i.test(source[1]))return new URL(source[1],finalUrl).href;throw Error("No se encontró un enlace m3u8")}
async function openChannel(eventIndex,channelIndex){let e=all[eventIndex],c=e&&e.canales&&e.canales[channelIndex];if(!c||!c.link)return;$("player").style.display="block";$("now").textContent=e.titulo||"Deportes";$("playerHint").textContent="Siguiendo la transmisión y extrayendo m3u8…";try{let url=await resolveM3u8(c.link,0);$("playerHint").textContent="Canal: "+(c.nombre||"Transmisión");if(window.Clappr){window.sportsPlayer=new Clappr.Player({source:url,parentId:"#clappr",width:"100%",height:"100%",autoPlay:true,plugins:[],mediacontrol:{seekbar:"#a44cff",buttons:"#ffffff"}})}else{let v=$("video");v.style.display="block";v.src=url;await v.play().catch(()=>{})}}catch(err){$("playerHint").textContent="No se pudo resolver este canal: "+err.message}}
function closePlayer(){if(window.sportsPlayer){window.sportsPlayer.destroy();window.sportsPlayer=null}let v=$("video");v.pause();v.removeAttribute("src");v.load();$("clappr").innerHTML="";$("player").style.display="none"}
load();
</script>
</body>
</html>
